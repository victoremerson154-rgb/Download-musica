<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixador MP4</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>🎬 Baixador MP4</h1>
        <p class="subtitle">Cole o link do vídeo e baixe em MP4 com áudio.</p>

        <div class="box">
            <input
                id="url"
                type="url"
                placeholder="Cole o link do vídeo aqui..."
                autocomplete="off"
            >

            <button id="downloadBtn">
                ⬇️ Baixar vídeo
            </button>
        </div>

        <div id="status"></div>

        <a id="downloadLink" class="download" style="display:none">
            ⬇️ Baixar MP4
        </a>
    </main>

    <script src="/script.js"></script>
</body>
</html>
