<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixador MP4</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main class="container">
    <section class="card">
        <div class="logo">▶</div>

        <h1>Baixador MP4</h1>
        <p class="subtitle">Cole o link do vídeo abaixo</p>

        <input
            id="url"
            type="url"
            placeholder="https://..."
            autocomplete="off"
        >

        <button id="downloadBtn">
            Baixar MP4
        </button>

        <div id="status"></div>
        <div id="result"></div>
    </section>
</main>

<script src="/script.js"></script>
</body>
</html>
